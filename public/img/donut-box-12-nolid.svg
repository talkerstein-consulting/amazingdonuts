<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 640" width="764" height="640" role="img" aria-label="Amazing Donuts 12-count open doughnut tray, no lid">
  <defs>
    <!-- soft drop shadow under the box -->
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.10"/>
    </filter>

    <linearGradient id="bodyFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="1" stop-color="#f2f2f2"/>
    </linearGradient>

    <!-- doughnut ghost shapes -->
    <g id="dScallop">
      <path d="M 38.00 0.00 A 11.40 11.40 0 0 1 32.91 19.00 A 11.40 11.40 0 0 1 19.00 32.91 A 11.40 11.40 0 0 1 0.00 38.00 A 11.40 11.40 0 0 1 -19.00 32.91 A 11.40 11.40 0 0 1 -32.91 19.00 A 11.40 11.40 0 0 1 -38.00 0.00 A 11.40 11.40 0 0 1 -32.91 -19.00 A 11.40 11.40 0 0 1 -19.00 -32.91 A 11.40 11.40 0 0 1 -0.00 -38.00 A 11.40 11.40 0 0 1 19.00 -32.91 A 11.40 11.40 0 0 1 32.91 -19.00 A 11.40 11.40 0 0 1 38.00 0.00 Z"/>
      <circle r="14"/>
    </g>
    <g id="dRing">
      <circle r="40"/>
      <circle r="16"/>
    </g>
    <g id="dGlazed">
      <circle r="16"/>
      <path d="M -40 -4 A 40 40 0 0 1 -14 -37"/>
      <path d="M -2 -40 A 40 40 0 0 1 30 -26"/>
      <path d="M 39 -9 A 40 40 0 0 1 26 30"/>
      <path d="M 14 37 A 40 40 0 0 1 -25 31"/>
      <path d="M -35 20 A 40 40 0 0 1 -40 4"/>
    </g>
    <g id="dSprinkle">
      <circle r="40"/>
      <circle r="16"/>
      <g stroke-linecap="round">
        <path d="M -25 -18 l 8 -5"/>
        <path d="M -6 -29 l 3 -9"/>
        <path d="M 14 -26 l 7 6"/>
        <path d="M 27 -8 l 9 -2"/>
        <path d="M 24 12 l 4 8"/>
        <path d="M 6 27 l -2 9"/>
        <path d="M -15 24 l -8 5"/>
        <path d="M -29 6 l -9 1"/>
        <path d="M -2 -20 l 8 3"/>
        <path d="M 18 4 l 1 9"/>
        <path d="M -18 8 l -7 5"/>
      </g>
    </g>

  </defs>

  <g transform="translate(-68 -120)">


  <!-- ===== BOX BODY ===== -->
  <g filter="url(#boxShadow)">
    <rect x="114" y="166" width="672" height="546" rx="4" fill="url(#bodyFace)" stroke="#e6e6e6" stroke-width="1.5"/>
    <path d="M 114 166 L 786 166 L 760 200 L 140 200 Z" fill="#f6f6f6" stroke="#ececec" stroke-width="1"/>
    <path d="M 114 712 L 786 712 L 760 678 L 140 678 Z" fill="#efefef" stroke="#e8e8e8" stroke-width="1"/>
    <path d="M 114 166 L 140 200 L 140 678 L 114 712 Z" fill="#f4f4f4" stroke="#ececec" stroke-width="1"/>
    <path d="M 786 166 L 760 200 L 760 678 L 786 712 Z" fill="#f0f0f0" stroke="#e8e8e8" stroke-width="1"/>
    <rect x="140" y="200" width="620" height="478" fill="#f5f5f5" stroke="#ededed" stroke-width="1"/>
  </g>

  <!-- ===== DOUGHNUT IMPRESSIONS (12) ===== -->
  <g fill="none" stroke="#e4e4e4" stroke-width="2.2">
    <use href="#dScallop" x="218" y="280"/>
    <use href="#dRing" x="372" y="280"/>
    <use href="#dSprinkle" x="528" y="280"/>
    <use href="#dGlazed" x="682" y="280"/>
    <use href="#dSprinkle" x="218" y="439"/>
    <use href="#dGlazed" x="372" y="439"/>
    <use href="#dScallop" x="528" y="439"/>
    <use href="#dRing" x="682" y="439"/>
    <use href="#dScallop" x="218" y="598"/>
    <use href="#dRing" x="372" y="598"/>
    <use href="#dSprinkle" x="528" y="598"/>
    <use href="#dGlazed" x="682" y="598"/>
  </g>
  </g>
</svg>
