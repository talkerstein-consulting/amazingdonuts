    <meta name="theme-color" content="#0e3e69" />

    <link rel="preload" href="/fonts/NCLQikober-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand system v5: Karla is the only non-display face. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Search · Amazing Donuts</title>
  </head>
